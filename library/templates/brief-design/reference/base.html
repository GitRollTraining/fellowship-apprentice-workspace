<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title><!-- REPLACE: page title --></title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #ffffff;
    --bg-subtle:    #f7f6f3;
    --bg-hover:     #efeeeb;
    --text:         #37352f;
    --text-soft:    #787672;
    --text-muted:   #9b9a97;
    --rule:         #e9e9e7;

    --accent:       #0f6b58;
    --accent-soft:  #ddeee6;
    --warn:         #a8574a;
    --warn-soft:    #fbecea;
    --blue:         #337ea9;
    --blue-soft:    #ddebf1;
    --purple:       #6940a5;
    --purple-soft:  #e8deee;
    --yellow-soft:  #fdecc8;
    --yellow-text:  #8a6500;
    --orange:       #c96c3f;
    --orange-soft:  #faebdd;
    --gray-soft:    #ebeced;

    --radius: 4px;
    --radius-lg: 6px;

    --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 16px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; font-feature-settings: "cv11";
  }

  .page { max-width: 740px; margin: 0 auto; padding: 64px 56px 120px; }

  .header { margin-bottom: 40px; }
  .kicker {
    font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-soft); margin-bottom: 14px;
  }
  .title {
    font-size: 40px; font-weight: 700; line-height: 1.15;
    letter-spacing: -0.02em; margin-bottom: 12px;
  }
  .subtitle { font-size: 15px; color: var(--text-soft); line-height: 1.5; }

  .props {
    display: grid; grid-template-columns: 140px 1fr;
    gap: 4px 16px; margin: 28px 0 0;
    font-size: 14px; padding: 20px 0 4px;
    border-top: 1px solid var(--rule);
  }
  .props dt { color: var(--text-soft); display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .props dd { padding: 6px 0; color: var(--text); }
  .props .tag {
    display: inline-block; padding: 2px 8px; border-radius: 3px;
    font-size: 12px; background: var(--gray-soft); color: var(--text); font-weight: 500;
  }
  .props .tag.red { background: var(--warn-soft); color: var(--warn); }
  .props .tag.green { background: var(--accent-soft); color: var(--accent); }
  .props .tag.blue { background: var(--blue-soft); color: var(--blue); }
  .props .tag.yellow { background: var(--yellow-soft); color: var(--yellow-text); }

  h1 {
    font-size: 28px; font-weight: 700; line-height: 1.2;
    letter-spacing: -0.015em; margin: 60px 0 12px;
    display: flex; align-items: baseline; gap: 10px;
  }
  h1 .h-num {
    font-size: 13px; font-weight: 600; color: var(--text-muted);
    letter-spacing: 0.04em; font-feature-settings: "tnum";
  }
  h2 {
    font-size: 20px; font-weight: 600; line-height: 1.3;
    letter-spacing: -0.01em; margin: 30px 0 8px;
  }
  h3 { font-size: 16px; font-weight: 600; margin: 22px 0 8px; }

  p { margin: 10px 0; color: var(--text); }
  p.lede { color: var(--text-soft); font-size: 15px; margin-top: 4px; }

  a {
    color: var(--blue); text-decoration: underline;
    text-decoration-color: rgba(51,126,169,0.3); text-underline-offset: 2px;
  }
  a:hover { text-decoration-color: var(--blue); }

  strong { font-weight: 600; color: var(--text); }
  em { font-style: italic; }

  .callout {
    display: flex; gap: 12px; padding: 14px 16px;
    background: var(--bg-subtle); border-radius: var(--radius-lg);
    margin: 18px 0; align-items: flex-start;
  }
  .callout.accent { background: var(--accent-soft); }
  .callout.warn { background: var(--warn-soft); }
  .callout.blue { background: var(--blue-soft); }
  .callout.yellow { background: var(--yellow-soft); }
  .callout.purple { background: var(--purple-soft); }
  .callout.orange { background: var(--orange-soft); }
  .callout .co-label {
    flex-shrink: 0; min-width: 52px; padding-top: 3px;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-soft);
  }
  .callout .co-body { font-size: 14.5px; line-height: 1.55; }
  .callout.accent .co-label, .callout.accent .co-body { color: var(--accent); }
  .callout.warn .co-label, .callout.warn .co-body { color: var(--warn); }
  .callout.blue .co-label { color: var(--blue); }
  .callout.yellow .co-label, .callout.yellow .co-body { color: var(--yellow-text); }
  .callout.purple .co-label, .callout.purple .co-body { color: var(--purple); }
  .callout.orange .co-label, .callout.orange .co-body { color: var(--orange); }

  ul, ol { margin: 8px 0 8px 4px; padding-left: 22px; }
  ul li, ol li { margin: 4px 0; padding-left: 4px; line-height: 1.55; }
  ul li::marker { color: var(--text-muted); }
  ol li::marker { color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .todo { list-style: none; padding-left: 0; margin: 12px 0; }
  .todo li {
    display: grid; grid-template-columns: 22px 1fr; gap: 8px;
    margin: 6px 0; padding: 2px 0; align-items: start;
  }
  .todo .box {
    margin-top: 3px; width: 16px; height: 16px;
    border: 1.5px solid var(--text-muted); border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; overflow: hidden;
  }
  /* check mark and half-fill are drawn in CSS, so they print and need no font */
  .todo li.done .box { background: var(--accent); border-color: var(--accent); }
  .todo li.done .box::before {
    content: ""; width: 4px; height: 8px; margin-top: -2px;
    border: solid #ffffff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .todo li.partial .box {
    border-color: var(--yellow-text);
    background: linear-gradient(90deg, var(--yellow-text) 50%, transparent 50%);
  }
  .todo li.done .txt { color: var(--text-muted); text-decoration: line-through; text-decoration-color: var(--text-muted); }
  .todo .txt { font-size: 15px; line-height: 1.5; }
  .todo .txt b { color: var(--text); font-weight: 600; }

  details { margin: 10px 0; border-radius: var(--radius); }
  details summary {
    cursor: pointer; padding: 6px 8px 6px 4px; margin: 0 -8px;
    border-radius: var(--radius); list-style: none;
    display: flex; align-items: center; gap: 8px;
    font-weight: 500; font-size: 15px; transition: background 120ms;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary:hover { background: var(--bg-subtle); }
  details summary::before {
    content: ""; flex-shrink: 0;
    width: 0; height: 0; margin-left: 2px;
    border-left: 5px solid var(--text-muted);
    border-top: 4px solid transparent; border-bottom: 4px solid transparent;
    transition: transform 180ms;
  }
  details[open] summary::before { transform: rotate(90deg); }
  details .toggle-body { padding: 4px 0 8px 20px; font-size: 15px; color: var(--text); }

  hr { border: none; border-top: 1px solid var(--rule); margin: 40px 0; }

  .mention {
    display: inline-block; padding: 1px 6px; background: var(--bg-subtle);
    border-radius: 3px; font-size: 13.5px; color: var(--text);
  }
  .mention::before { content: "@"; color: var(--text-muted); }

  .inline-tag {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 12px; background: var(--gray-soft); color: var(--text); font-weight: 500;
  }
  .inline-tag.green { background: var(--accent-soft); color: var(--accent); }
  .inline-tag.red { background: var(--warn-soft); color: var(--warn); }
  .inline-tag.yellow { background: var(--yellow-soft); color: var(--yellow-text); }
  .inline-tag.blue { background: var(--blue-soft); color: var(--blue); }
  .inline-tag.purple { background: var(--purple-soft); color: var(--purple); }
  .inline-tag.orange { background: var(--orange-soft); color: var(--orange); }

  blockquote {
    padding: 4px 0 4px 14px; margin: 16px 0;
    border-left: 3px solid var(--text); font-size: 16px; line-height: 1.55;
  }
  blockquote cite {
    display: block; font-size: 13px; color: var(--text-soft);
    font-style: normal; margin-top: 6px;
  }

  .two-col {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 18px 0;
  }
  .two-col .col {
    background: var(--bg-subtle); border-radius: var(--radius-lg); padding: 16px 18px;
  }
  .two-col .col h3 {
    margin: 0 0 10px; font-size: 13px; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text-soft); font-weight: 600;
  }
  .two-col ul { margin: 0; padding-left: 18px; }
  .two-col li { font-size: 14px; line-height: 1.5; margin: 6px 0; }

  /* Scope list — numbered items, each with a status pill */
  .scope {
    border: 1px solid var(--rule); border-radius: var(--radius-lg);
    overflow: hidden; margin: 20px 0;
  }
  .scope-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px; background: var(--bg-subtle);
    border-bottom: 1px solid var(--rule);
  }
  .scope-header .scope-title { font-weight: 600; font-size: 15px; }
  .scope-header .scope-prog {
    font-size: 12.5px; color: var(--text-soft);
    font-feature-settings: "tnum"; font-weight: 500;
  }
  .scope-progbar { height: 6px; background: var(--rule); display: flex; overflow: hidden; }
  .scope-progbar .seg { flex: 1; border-right: 1px solid var(--bg); }
  .scope-progbar .seg:last-child { border-right: none; }
  .scope-progbar .seg.done { background: var(--accent); }
  .scope-progbar .seg.partial { background: var(--yellow-text); opacity: 0.8; }
  .scope-progbar .seg.pending { background: var(--rule); }
  .scope-item {
    display: grid; grid-template-columns: 28px 1fr auto;
    gap: 12px; padding: 12px 18px;
    border-bottom: 1px solid var(--rule);
    align-items: start;
  }
  .scope-item:last-child { border-bottom: none; }
  .scope-item .scope-n {
    font-size: 13px; color: var(--text-muted); font-weight: 600;
    padding-top: 2px; font-feature-settings: "tnum";
  }
  .scope-item .scope-body { font-size: 14px; line-height: 1.5; }
  .scope-item .scope-body b { font-weight: 600; display: block; margin-bottom: 2px; color: var(--text); }
  .scope-item .scope-body .d { color: var(--text-soft); font-size: 13px; }
  .scope-item .scope-status {
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 3px;
    letter-spacing: 0.02em; white-space: nowrap;
    align-self: center;
  }
  .scope-status.done { background: var(--accent-soft); color: var(--accent); }
  .scope-status.partial { background: var(--yellow-soft); color: var(--yellow-text); }
  .scope-status.pending { background: var(--gray-soft); color: var(--text-soft); }
  .scope-item .scope-layer {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600;
    padding: 2px 7px; border-radius: 3px;
    margin-top: 6px; letter-spacing: 0.02em;
  }
  .scope-layer::before { content: ""; width: 7px; height: 7px; border-radius: 50%; }
  .scope-layer.agent { background: var(--blue-soft); color: var(--blue); }
  .scope-layer.agent::before { background: var(--blue); }
  .scope-layer.material { background: var(--purple-soft); color: var(--purple); }
  .scope-layer.material::before { background: var(--purple); }
  .scope-layer.human { background: var(--orange-soft); color: var(--orange); }
  .scope-layer.human::before { background: var(--orange); }

  /* Structure diagram */
  .arch {
    margin: 20px 0; padding: 20px 22px;
    background: var(--bg-subtle); border-radius: var(--radius-lg);
  }
  .arch-title {
    font-size: 13px; color: var(--text-soft);
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 14px; font-weight: 600;
  }
  .arch-layer-label {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 6px;
  }
  .arch-row { display: grid; gap: 8px; margin-bottom: 4px; }
  .arch-row.three { grid-template-columns: repeat(3, 1fr); }
  .arch-row.two { grid-template-columns: repeat(2, 1fr); }
  .arch-box {
    background: #ffffff; border: 1px solid var(--rule); border-radius: 4px;
    padding: 10px 12px; font-size: 12.5px; line-height: 1.35;
  }
  .arch-box b { display: block; font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .arch-box .desc { color: var(--text-soft); font-size: 11.5px; }
  .arch-box.agent { border-left: 3px solid var(--blue); }
  .arch-box.material { border-left: 3px solid var(--purple); }
  .arch-box.human { border-left: 3px solid var(--orange); }
  .arch-box.built {
    background: var(--accent-soft); border-color: var(--accent);
    border-left: 3px solid var(--accent);
  }
  .arch-box.built b::after {
    content: " · built"; color: var(--accent); font-weight: 500; font-size: 11px;
  }
  /* the arrow points up at the row above; drawn in CSS so it prints */
  .arch-arrow {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    color: var(--text-muted); font-size: 11px;
    padding: 4px 0 2px; letter-spacing: 0.04em;
  }
  .arch-arrow::before {
    content: ""; width: 0; height: 0;
    border-bottom: 6px solid var(--text-muted);
    border-left: 4px solid transparent; border-right: 4px solid transparent;
  }

  /* Comparison chart */
  .cost-chart {
    margin: 20px 0 12px; background: var(--bg-subtle);
    padding: 20px 22px 18px; border-radius: var(--radius-lg);
  }
  .cost-chart .chart-title {
    font-size: 13px; color: var(--text-soft);
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 16px; font-weight: 600;
  }
  .cost-row {
    display: grid; grid-template-columns: 150px 1fr 110px;
    gap: 14px; align-items: center; padding: 8px 0;
  }
  .cost-row .cr-label { font-size: 13.5px; font-weight: 500; line-height: 1.3; }
  .cost-row .cr-label .sub {
    display: block; font-size: 11.5px; color: var(--text-soft);
    font-weight: 400; margin-top: 2px;
  }
  .cost-row .cr-bar {
    position: relative; height: 22px; background: #ffffff;
    border-radius: 3px; overflow: hidden; border: 1px solid var(--rule);
  }
  .cost-row .cr-fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
  .cost-row.total .cr-fill { background: #d4d1cb; }
  .cost-row.captured .cr-fill { background: var(--accent); }
  .cost-row.expandable .cr-fill { background: var(--purple); opacity: 0.7; }
  .cost-row.remaining .cr-fill { background: var(--orange); opacity: 0.65; }
  .cost-row .cr-num {
    font-size: 14px; font-weight: 600; text-align: right; font-feature-settings: "tnum";
  }
  .cost-row .cr-num .sub {
    display: block; font-size: 11px; font-weight: 400;
    color: var(--text-soft); margin-top: 2px;
  }

  /* Featured block — one per document */
  .featured {
    border: 2px solid var(--orange); background: var(--orange-soft);
    border-radius: var(--radius-lg); padding: 18px 20px; margin: 20px 0;
  }
  .featured-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .featured-head h3 { margin: 0; font-size: 17px; font-weight: 600; color: var(--orange); }
  .featured-head .when {
    margin-left: auto; font-size: 12px; font-weight: 600;
    background: var(--orange); color: #ffffff;
    padding: 3px 10px; border-radius: 3px; letter-spacing: 0.02em;
  }
  .featured p { font-size: 14px; color: var(--text); margin: 6px 0; line-height: 1.55; }
  .featured ul { margin: 8px 0; padding-left: 20px; }
  .featured li { font-size: 14px; line-height: 1.55; }

  .footer {
    margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--rule);
    font-size: 13px; color: var(--text-muted);
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }

  /* Sidebar table of contents */
  .toc {
    position: fixed; top: 64px;
    right: max(24px, calc((100vw - 740px) / 2 - 220px));
    width: 180px; font-size: 12.5px; color: var(--text-soft); display: block;
  }
  .toc .toc-title {
    text-transform: uppercase; letter-spacing: 0.06em;
    font-size: 10.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px;
  }
  .toc ol { list-style: none; padding: 0; margin: 0; }
  .toc li { margin: 4px 0; }
  .toc a {
    color: var(--text-soft); text-decoration: none; display: block;
    padding: 3px 8px 3px 10px;
    border-left: 2px solid transparent; border-radius: 0 3px 3px 0;
    transition: all 160ms; line-height: 1.35;
  }
  .toc a:hover { background: var(--bg-subtle); color: var(--text); }
  .toc a.active { color: var(--text); border-left-color: var(--text); font-weight: 500; }

  @media (max-width: 1100px) { .toc { display: none; } }
  @media (max-width: 720px) {
    .page { padding: 40px 24px 80px; }
    .title { font-size: 32px; }
    h1 { font-size: 24px; }
    .two-col { grid-template-columns: 1fr; }
    .props { grid-template-columns: 100px 1fr; font-size: 13px; }
    .cost-row { grid-template-columns: 120px 1fr 90px; gap: 10px; }
    .scope-item { grid-template-columns: 24px 1fr; }
    .scope-item .scope-status { grid-column: 2; justify-self: start; margin-top: 4px; }
  }
  @media print {
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { font-size: 13px; }
    .toc { display: none; }
    .page { max-width: none; padding: 24px 36px; }
    details { display: none; }
    a { color: var(--text); text-decoration: none; }
    .callout, .arch, .featured, .cost-chart, .two-col .col, .scope { break-inside: avoid; }
  }
</style>
</head>

<main class="page">

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="kicker"><!-- REPLACE: document kind — Handover, Process, Status, Closing summary --></div>
    <h1 class="title"><!-- REPLACE: page title --></h1>
    <p class="subtitle"><!-- REPLACE: what it covers · date --></p>

    <dl class="props">
      <dt>Business</dt><dd><!-- REPLACE: business name --></dd>
      <dt>Contact</dt><dd><span class="mention"><!-- REPLACE: name --></span> · <!-- REPLACE: role --></dd>

      <dt>Status</dt><dd><span class="tag green">Handed over</span> &nbsp; <!-- REPLACE: one detail --></dd>

  <h1 id="section-2"><span class="h-num">02</span> <!-- REPLACE: section 2 title --></h1>
  <p class="lede"><!-- REPLACE: one-line preview, or delete this line --></p>

  <!-- Example: a callout. Three per document, maximum. -->
  <div class="callout accent">
    <div class="co-label">Note</div>
    <div class="co-body"><strong><!-- REPLACE: the lead-in. --></strong> <!-- REPLACE: information that is not in the prose beside it --></div>
  </div>

  <!-- More sections as needed. Add the matching sidebar entry above. -->

  <!-- Optional: where the numbers came from. Hidden when printed, so nothing essential goes here. -->

    <div class="toggle-body">
      <ul>
        <li><!-- REPLACE: source, count, or date --></li>

<script>
  // Highlights the section being read in the sidebar. Do not modify.
  const headings = document.querySelectorAll('h1[id]');
  const tocLinks = document.querySelectorAll('.toc a');
  const byId = new Map();
  tocLinks.forEach(a => byId.set(a.getAttribute('href').slice(1), a));
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        tocLinks.forEach(a => a.classList.remove('active'));
        const link = byId.get(e.target.id);
        if (link) link.classList.add('active');
      }
    });
  }, { rootMargin: '-20% 0px -70% 0px', threshold: 0 });
  headings.forEach(h => io.observe(h));
</script>
</body>
</html>
